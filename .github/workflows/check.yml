name: Stock Monitor Action
on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch:

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          # 🔍 여기에 필요한 도구들을 모두 적어줘야 로봇이 챙겨갑니다!
          pip install OpenDartReader pandas requests pykrx finance-datareader
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python monitor.py
