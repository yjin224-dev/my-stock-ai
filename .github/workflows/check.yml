name: Stock Monitor Action
on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch: # 직접 실행 버튼

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install OpenDartReader pandas requests
      - name: Run logic
        env:
          # 깃허브 Secrets에 저장된 키를 연결합니다
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python monitor.py # 파일 이름이 monitor.py여야 합니다!
