name: Stock Power Monitor

on:
  schedule:
    # 한국 시간 기준 오전 9시 10분 ~ 오후 3시 50분까지 10분마다 실행
    - cron: '*/10 0-7 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests finance-datareader pandas
      - name: Run Power Monitor
        env:
          # GitHub Secrets에 저장한 토큰을 불러옵니다.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python monitor_bot.py
